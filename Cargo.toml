[package]
name = "rtr"
version = "0.1.0"
edition = "2021"
description = "Native profile launcher for Claude Code and Codex"
license = "MIT OR Apache-2.0"

[[bin]]
name = "rtr"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "signal"] }
libc = "0.2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
crossterm = "0.29"
# Keep matcher offsets in Unicode scalar coordinates, matching transcript ranges
# and rendered highlight spans (grapheme collapsing would shift later matches).
nucleo-matcher = { version = "0.3", default-features = false, features = ["unicode-normalization", "unicode-casefold"] }

uuid = { version = "1", features = ["v4"] }
tempfile = "3"

[dev-dependencies]
vt100 = "0.16"
